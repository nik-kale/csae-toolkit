name: CI

on:
  push:
    branches: [master, main, modernization]
  pull_request:

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check version consistency
        run: npm run check-version

      - name: Security audit
        run: npm audit --audit-level=high
